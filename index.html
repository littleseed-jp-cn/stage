// ==========================================
// 3. BỘ PHÁT ÂM CHUẨN BẢN XỨ (NEURAL VOICES) & AUTO-PLAY
// ==========================================
let speechRate = 1.0;
let cachedVoices = [];
let isAutoPlaying = false;
let autoPlayTimer = null;
let completedDays = JSON.parse(localStorage.getItem('completedDaysHsk3') || '[]');

function loadVoices() {
  cachedVoices = window.speechSynthesis.getVoices();
}
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

const urlParams = new URLSearchParams(window.location.search);
let savedKidName = urlParams.get('con') || localStorage.getItem('registeredKidName') || '';
let isUnlocked = Boolean(savedKidName);

function updateHeaderWelcome() {
  if (savedKidName) {
    document.getElementById('welcomeText').textContent = `Chào bé ${savedKidName}! Chinh phục 10 từ Trung – Nhật mỗi ngày nhé 🌟`;
  }
}
updateHeaderWelcome();

function sendToGoogleSheet(payload) {
  if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.includes("DAN_LINK")) return;
  fetch(GOOGLE_SHEET_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).catch(err => console.log("Lỗi gửi dữ liệu:", err));
}

function handleUnlockSubmit(event) {
  event.preventDefault();
  const kidInput = document.getElementById('inputKidName').value.trim();
  const contactInput = document.getElementById('inputContact').value.trim();
  const ageInput = document.getElementById('inputAge').value;
  if (!kidInput || !contactInput) return;

  localStorage.setItem('registeredKidName', kidInput);
  localStorage.setItem('registeredContact', contactInput);
  savedKidName = kidInput;
  isUnlocked = true;
  updateHeaderWelcome();

  sendToGoogleSheet({
    type: "Đăng ký mở khóa HSK3",
    kidName: kidInput,
    contact: contactInput,
    detail: `Độ tuổi: ${ageInput}`
  });

  alert(`🎉 Đã mở khóa trọn bộ bài học cho bé ${kidInput}!`);
  renderLesson();
}

function toggleSpeed() {
  const btn = document.getElementById('speedToggle');
  if (speechRate === 1.0) {
    speechRate = 0.75;
    btn.textContent = "Tốc độ: Đọc chậm (0.75x)";
    btn.classList.add('slow');
  } else {
    speechRate = 1.0;
    btn.textContent = "Tốc độ: Chuẩn (1.0x)";
    btn.classList.remove('slow');
  }
}

function speak(text, lang, onEndCallback = null) {
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  utter.rate = speechRate;
  utter.pitch = 1.05; // Cao độ thân thiện với trẻ em

  const voices = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();

  if (lang === 'ja-JP') {
    // Ưu tiên giọng Neural tự nhiên nhất của Nhật
    const preferredJp = voices.find(v =>
      v.lang.includes('ja') &&
      (v.name.includes('Nanami') || v.name.includes('Google') || v.name.includes('Kyoko') || v.name.includes('O-Ren') || v.name.includes('Haruka'))
    ) || voices.find(v => v.lang.includes('ja'));
    if (preferredJp) utter.voice = preferredJp;
  } else if (lang === 'zh-CN') {
    // Ưu tiên giọng Neural tự nhiên nhất của Trung Quốc
    const preferredCn = voices.find(v =>
      (v.lang.includes('zh-CN') || v.lang.includes('zh_CN')) &&
      (v.name.includes('Xiaoxiao') || v.name.includes('Google') || v.name.includes('Ting-Ting') || v.name.includes('Yaoyao'))
    ) || voices.find(v => v.lang.includes('zh'));
    if (preferredCn) utter.voice = preferredCn;
  }

  if (onEndCallback) {
    utter.onend = onEndCallback;
    utter.onerror = onEndCallback;
  }
  window.speechSynthesis.speak(utter);
}

function stopAutoPlay() {
  isAutoPlaying = false;
  clearTimeout(autoPlayTimer);
  window.speechSynthesis.cancel();
  const btn = document.getElementById('autoPlayBtn');
  if (btn) {
    btn.textContent = "▶️ Nghe tự động 10 từ";
    btn.classList.remove('playing');
  }
  document.querySelectorAll('.vocab-card').forEach(c => c.classList.remove('speaking-now'));
}

function toggleAutoPlay() {
  if (isAutoPlaying) {
    stopAutoPlay();
    return;
  }
  const activeDay = getCurrentDay();
  const lesson = LESSONS.find(l => l.day === activeDay);
  if (!lesson || (!isUnlocked && activeDay > FREE_DAYS_LIMIT)) return;

  isAutoPlaying = true;
  const btn = document.getElementById('autoPlayBtn');
  btn.textContent = "⏹️ Dừng nghe tự động";
  btn.classList.add('playing');

  let index = 0;
  function playNextCard() {
    if (!isAutoPlaying || index >= lesson.vocab.length) {
      stopAutoPlay();
      return;
    }
    const item = lesson.vocab[index];
    document.querySelectorAll('.vocab-card').forEach(c => c.classList.remove('speaking-now'));
    const cardEl = document.getElementById(`vocab-card-${index}`);
    if (cardEl) {
      cardEl.classList.add('speaking-now');
      cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Đọc tiếng Trung lần 1 -> Tiếng Trung lần 2 -> Tiếng Nhật -> Chuyển thẻ tiếp theo
    speak(item.cn, 'zh-CN', () => {
      if (!isAutoPlaying) return;
      autoPlayTimer = setTimeout(() => {
        speak(item.cn, 'zh-CN', () => {
          if (!isAutoPlaying) return;
          autoPlayTimer = setTimeout(() => {
            speak(item.speakJp, 'ja-JP', () => {
              if (!isAutoPlaying) return;
              index++;
              autoPlayTimer = setTimeout(playNextCard, 700);
            });
          }, 400);
        });
      }, 400);
    });
  }
  playNextCard();
}

function getCurrentDay() {
  const match = window.location.hash.match(/#\/ngay\/(\d+)/);
  const dayNum = match ? parseInt(match[1]) : 1;
  return LESSONS.find(l => l.day === dayNum) ? dayNum : 1;
}

function goToDay(dayNum) {
  stopAutoPlay();
  window.location.hash = `#/ngay/${dayNum}`;
}

function renderNav(activeDay) {
  const nav = document.getElementById('dayNav');
  nav.innerHTML = LESSONS.map(l => {
    const isDone = completedDays.includes(l.day) ? 'done' : '';
    const isLocked = (!isUnlocked && l.day > FREE_DAYS_LIMIT) ? 'locked' : '';
    const isActive = l.day === activeDay ? 'active' : '';
    return `<button class="day-btn ${isActive} ${isDone} ${isLocked}" onclick="goToDay(${l.day})">Ngày ${l.day}</button>`;
  }).join('');
}

function checkAnswer(dayNum, selectedIdx, correctIdx, btnEl) {
  const allBtns = document.querySelectorAll('.quiz-opt');
  allBtns.forEach(b => b.disabled = true);
  const fb = document.getElementById('quizFeedback');

  if (selectedIdx === correctIdx) {
    btnEl.classList.add('correct');
    fb.innerHTML = "🎉 Chính xác! Bé giỏi quá! Đã mở khóa ngôi sao Ngày " + dayNum;
    fb.style.color = "#2D6A4F";
    if (!completedDays.includes(dayNum)) {
      completedDays.push(dayNum);
      localStorage.setItem('completedDaysHsk3', JSON.stringify(completedDays));
      renderNav(dayNum);

      sendToGoogleSheet({
        type: "Hoàn thành bài học HSK3",
        kidName: savedKidName || "Khách (Chưa đăng ký)",
        contact: localStorage.getItem('registeredContact') || "",
        detail: `Đạt sao Ngày ${dayNum} (10 từ)`
      });
    }
  } else {
    btnEl.classList.add('wrong');
    allBtns[correctIdx].classList.add('correct');
    fb.innerHTML = "💡 Chưa đúng rồi, bé thử bấm nghe lại từ vựng ở trên nhé!";
    fb.style.color = "#C9184A";
  }
}

function renderLesson() {
  const activeDay = getCurrentDay();
  const lesson = LESSONS.find(l => l.day === activeDay);
  renderNav(activeDay);

  if (!isUnlocked && activeDay > FREE_DAYS_LIMIT) {
    document.getElementById('appContent').innerHTML = `
      <div class="gate-box">
        <h3>🔓 Mở khóa trọn bộ lộ trình HSK 3 cho bé</h3>
        <p>Bé đã hoàn thành ${FREE_DAYS_LIMIT} ngày trải nghiệm đầu tiên! Bố mẹ hãy điền thông tin bên dưới để mở khóa ngay <strong>Ngày 4 đến Ngày 7</strong> và nhận lộ trình học 10 từ/ngày cho bé nhé.</p>
        <form class="gate-form" onsubmit="handleUnlockSubmit(event)">
          <div>
            <label>Tên gọi ở nhà của bé *</label>
            <input type="text" id="inputKidName" placeholder="Ví dụ: Tiểu Bối, Minh Anh..." required>
          </div>
          <div>
            <label>Độ tuổi của bé</label>
            <select id="inputAge">
              <option value="4-6 tuổi (Mẫu giáo - Lớp 1)">4 – 6 tuổi (Mẫu giáo – Lớp 1)</option>
              <option value="7-9 tuổi (Lớp 2 - Lớp 4)">7 – 9 tuổi (Lớp 2 – Lớp 4)</option>
              <option value="10-12 tuổi (Lớp 5 - Lớp 6)">10 – 12 tuổi (Lớp 5 – Lớp 6)</option>
            </select>
          </div>
          <div>
            <label>Số Zalo / Facebook hoặc Email phụ huynh *</label>
            <input type="text" id="inputContact" placeholder="Để nhận tài liệu & theo dõi tiến độ của bé" required>
          </div>
          <button type="submit" class="btn-unlock">Mở khóa bài học ngay 🚀</button>
        </form>
        <p class="privacy-note">🔒 Thông tin được bảo mật và chỉ dùng để gửi tài liệu học tập cho bé.</p>
      </div>
    `;
    return;
  }

  const vocabHtml = lesson.vocab.map((v, idx) => `
    <div class="vocab-card" id="vocab-card-${idx}">
      <span class="card-num">${idx + 1}/10</span>
      <div class="emoji">${v.emoji}</div>
      <div class="cn-word">${v.cn}</div>
      <div class="pinyin">${v.pinyin}</div>
      <div class="vi-word">${v.vi}</div>
      <div class="jp-box">
        <div class="jp-word"><ruby>${v.jp}<rt>${v.jp !== v.speakJp ? v.speakJp : ''}</rt></ruby></div>
        <div class="romaji">${v.romaji}</div>
      </div>
      <div class="audio-row">
        <button class="btn-speak btn-cn" onclick="stopAutoPlay(); speak('${v.cn}', 'zh-CN')">🇨🇳 Nghe CN</button>
        <button class="btn-speak btn-jp" onclick="stopAutoPlay(); speak('${v.speakJp}', 'ja-JP')">🇯🇵 Nghe JP</button>
      </div>
    </div>
  `).join('');

  const sentenceHtml = lesson.sentences.map(s => `
    <div class="sentence-card">
      <div class="sentence-line">
        <div>
          <span class="sentence-text" style="color:#D62828;">🇨🇳 ${s.cn}</span>
          <span class="sentence-sub">${s.pinyin}</span>
        </div>
        <button class="btn-speak btn-cn" onclick="stopAutoPlay(); speak('${s.cn}', 'zh-CN')">🔊 Đọc CN</button>
      </div>
      <div class="sentence-line">
        <span class="sentence-text">🇯🇵 ${s.jp}</span>
        <button class="btn-speak btn-jp" onclick="stopAutoPlay(); speak('${s.speakJp}', 'ja-JP')">🔊 Đọc JP</button>
      </div>
      <div class="sentence-vi">🇻🇳 ${s.vi}</div>
    </div>
  `).join('');

  const quizHtml = lesson.quiz.options.map((opt, idx) => `
    <button class="quiz-opt" onclick="checkAnswer(${lesson.day}, ${idx}, ${lesson.quiz.answer}, this)">
      ${String.fromCharCode(65 + idx)}. ${opt}
    </button>
  `).join('');

  document.getElementById('appContent').innerHTML = `
    <div class="lesson-header">
      <h2>${lesson.title}</h2>
    </div>

    <div class="section-title">📚 1. 10 Từ vựng hôm nay (Trung – Việt – Nhật)</div>
    <div class="vocab-grid">${vocabHtml}</div>

    <div class="section-title">💬 2. Mẫu câu phản xạ thực tế</div>
    ${sentenceHtml}

    <div class="quiz-box">
      <div class="quiz-q">🎮 3. Thử thách nhận sao: ${lesson.quiz.question}</div>
      <div class="quiz-options">${quizHtml}</div>
      <div class="feedback" id="quizFeedback"></div>
    </div>
  `;
}

window.addEventListener('hashchange', renderLesson);
renderLesson();
